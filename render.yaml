# ESGenuine — Render Blueprint: the dashboard as a free static site.
#
# The FastAPI backend is hosted separately, on a Hugging Face Docker Space: it needs about
# 1 GB of RAM, more than Render's free 512 MB. See DEPLOY.md.
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo -> apply, then fill the
# three `sync: false` values when prompted.

services:
  - type: web
    name: esgenuine
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Public backend URL, e.g. https://<hf-user>-esgenuine-api.hf.space
      - key: VITE_API_BASE
        sync: false
      # Supabase project URL and publishable (anon) key. Both end up in the public bundle
      # by design: the database grants this key SELECT only (row-level security), so the
      # hosted site is read-only.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      # SPA fallback — React Router owns client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html
