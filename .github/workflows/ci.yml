name: CI

on:
  push:
    branches: [main, ESG_V1]
  pull_request:

jobs:
  backend-tests:
    name: Backend — pytest (offline suites)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # spaCy model is loaded lazily on demand; install the small one as insurance
          # so any parser-touching test has a model to fall back to.
          python -m spacy download en_core_web_sm || true
      - name: Run offline test suite
        # The `live` marker (Groq/NVIDIA/Supabase) is deselected; scripts/ (live DB) is
        # excluded via testpaths in pyproject.toml.
        run: python -m pytest -m "not live"
      - name: Lint (advisory — real errors only)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

  frontend-build:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        # MUST be build mode (`-b`). Plain `tsc --noEmit` resolves frontend/tsconfig.json,
        # which is a solution-style config (`"files": []` + project references) — so it
        # type-checks NOTHING and always exits 0. That silently hid 10 real errors while
        # this job reported green. `-b` walks the referenced projects (tsconfig.app.json,
        # tsconfig.node.json); `--force` skips incremental caching so CI is deterministic.
        # `noEmit: true` in tsconfig.app.json means build mode still emits no JS.
        run: npx tsc -b --force
      - name: Build
        run: npm run build
